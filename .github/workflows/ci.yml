name: CI

on:
  push:
    branches: [develop, staging, main, master, 'release/**', 'hotfix/**']
  pull_request:
    branches: [develop, staging, main, master, 'release/**', 'hotfix/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    uses: DaVinciBot/shared-workflows/.github/workflows/ci.yml@v1.2.1
    secrets: inherit
    with:
      pnpm_version: 11.5.2
      node_version_file: .nvmrc
