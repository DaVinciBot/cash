name: Security Scan

on:
  push:
    branches: [dev, staging, main, master, 'release/**', 'hotfix/**']
  pull_request:
    branches: [dev, staging, main, master, 'release/**', 'hotfix/**']
  schedule:
    - cron: '20 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  security:
    name: Security
    uses: DaVinciBot/shared-workflows/.github/workflows/security-scan.yml@v6.2.0
