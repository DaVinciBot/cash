name: E2E

on:
  push:
    branches: [staging, main, master]
  pull_request:
    branches: [staging, main, master, 'release/**', 'hotfix/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    uses: DaVinciBot/shared-workflows/.github/workflows/e2e.yml@v1.1.0
    with:
      pnpm_version: 10.33.0
      node_version_file: .nvmrc
