name: Container

on:
  push:
    branches: [dev, staging, main, master, 'release/**', 'hotfix/**']
    tags: ['v*.*.*']
  pull_request:
    branches: [dev, staging, main, master, 'release/**', 'hotfix/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  build-and-publish:
    name: Build and Publish
    uses: DaVinciBot/shared-workflows/.github/workflows/container.yml@v7.0.1
    with:
      push: ${{ github.event_name == 'push' }}
    secrets: inherit

  deploy-dev:
    name: Deploy Dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: build-and-publish
    uses: DaVinciBot/shared-workflows/.github/workflows/deploy.yml@v7.0.1
    with:
      environment: dev
      health_url: https://dev.davincibot.fr/admin/health
    secrets: inherit
