name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment.
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      image_ref:
        description: GHCR image reference to deploy, preferably image@sha256:digest.
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-dev:
    name: Deploy Dev
    if: inputs.environment == 'dev'
    uses: DaVinciBot/shared-workflows/.github/workflows/deploy.yml@v2.1.1
    with:
      environment: dev
      image_ref: ${{ inputs.image_ref }}
      health_url: https://dev.davincibot.fr/admin/health
    secrets: inherit

  deploy-staging:
    name: Deploy Staging
    if: inputs.environment == 'staging'
    uses: DaVinciBot/shared-workflows/.github/workflows/deploy.yml@v2.1.1
    with:
      environment: staging
      image_ref: ${{ inputs.image_ref }}
      health_url: https://staging.davincibot.fr/admin/health
    secrets: inherit

  deploy-prod:
    name: Deploy Prod
    if: inputs.environment == 'prod'
    uses: DaVinciBot/shared-workflows/.github/workflows/deploy.yml@v2.1.1
    with:
      environment: prod
      image_ref: ${{ inputs.image_ref }}
      health_url: https://davincibot.fr/admin/health
    secrets: inherit
